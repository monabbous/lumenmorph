/* Change this material and make it yours. */
body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  box-sizing: border-box;
  display: grid;
  place-items: center;
  background: #102a31;
  color: #e9f3ed;
  font-family: ui-monospace, monospace;
}
button,
input {
  font: inherit;
}
.lm-lab {
  width: 100%;
  max-width: 380px;
}
.lm-lab .showcase {
  --sg-ink: #e9f3ed;
  --sg-muted: #adc2c5;
  --sg-ember: #ffaa71;
  --sg-teal: #70d5c5;
  --lumen-bg: #16323680;
  --lumen-solid-bg: #163236;
  --lumen-glow-color: var(--sg-teal);
  --lumen-border-glow-color: #b4eee1;
  --lumen-glow-opacity: 0.2;
  --lumen-border-opacity: 0.75;
  --lumen-glow-size: 260px;
  --lumen-radius: 14px;
  --lumen-blur: 0px;
  --lumen-border-width: 1px;
  --lumen-border-color: #92b4ad30;
  color: var(--sg-ink);
  padding: 30px 0 32px;
  border-top: 0;
  scroll-margin-top: 100px;
}
.lm-lab .showcase * {
  box-sizing: border-box;
}
.lm-lab .showcase [hidden] {
  display: none !important;
}
.lm-lab #showcase-count {
  margin: 0;
  color: var(--sg-muted);
  font-size: 10px;
  white-space: nowrap;
}
.lm-lab .example {
  min-width: 0;
  border: 2px solid #8cafab30;
  border-radius: var(--studio-radius, 4px);
  background: #0b2028;
  overflow: hidden;
}
.lm-lab .showcase[data-enhanced]:not([data-in-view]),
.lm-lab .showcase[data-enhanced] .example:not([data-visible]) {
  --lumen-x: -100vw;
  --lumen-y: -100vh;
}
.lm-lab .showcase-demo {
  position: relative;
  padding: 24px;
  min-height: 220px;
  overflow: clip;
  isolation: isolate;
  font-size: 12px;
  line-height: 1.5;
}
.lm-lab .showcase-demo h3 {
  font-size: 25px;
  line-height: 1.15;
  letter-spacing: -0.055em;
  margin: 14px 0;
}
.lm-lab .showcase-demo p {
  margin: 0;
}
.lm-lab .showcase-demo button {
  min-height: 44px;
  font: inherit;
  font-size: 11px;
  color: var(--sg-ink);
  padding: 9px 12px;
  cursor: pointer;
}
.lm-lab .showcase-demo button[aria-pressed="true"] {
  color: var(--sg-ember);
}
.lm-lab .showcase :is(button, input, a, pre):focus-visible {
  outline: 2px solid var(--sg-ember);
  outline-offset: 3px;
}
.lm-lab .demo-kicker {
  display: block;
  color: var(--sg-muted);
  font-size: 8px;
  line-height: 1.5;
  letter-spacing: 0.13em;
}
.lm-lab .showcase-demo :is(button, input, label) {
  position: relative;
}
@keyframes lm-wave {
  to {
    transform: scaleY(0.25);
  }
}
.lm-lab .demo-beam {
  padding: 20px;
  background: #14292e;
}
.lm-lab .beam-card {
  position: relative;
  padding: 24px 20px;
  --lumen-bg: #12282b;
}
.lm-lab .beam-ring {
  pointer-events: none;
  position: absolute;
  inset: -1px;
  border: 1px solid transparent;
  border-radius: inherit;
  background: linear-gradient(
      120deg,
      transparent 15%,
      #87e7cd 35%,
      #ffd7a3 50%,
      #87e7cd 65%,
      transparent 85%
    )
    border-box;
  background-size: 300% 300%;
  padding: 1px;
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: lm-edge 3s linear infinite alternate paused;
  opacity: 0.6;
}
.lm-lab .example[data-visible] .beam-card:is(:hover, :focus-within) .beam-ring {
  animation-play-state: running;
}
.lm-lab .signal-orbit {
  display: block;
  width: 76px;
  height: 76px;
  margin: 28px 0;
  border: 1px solid #8ae6cd40;
  border-radius: 50%;
  text-align: center;
  line-height: 74px;
  color: var(--sg-teal);
  font-size: 28px;
  box-shadow:
    0 0 35px #70d5c515,
    inset 0 0 22px #70d5c515;
}
.lm-lab .beam-card p {
  color: var(--sg-muted);
  font-size: 10px;
  margin: 16px 0 22px;
}
.lm-lab .demo-beam[data-off] .signal-orbit {
  color: #658582;
  box-shadow: none;
}
.lm-lab .demo-beam[data-off] .beam-ring {
  opacity: 0.1;
  animation-play-state: paused !important;
}
@keyframes lm-edge {
  to {
    background-position: 100% 100%;
  }
}
@media (max-width: 600px) {
  .lm-lab .showcase {
    padding-top: 34px;
  }
  .lm-lab #showcase-count {
    margin-top: 14px;
  }
  .lm-lab .showcase-demo {
    padding-inline: 24px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .lm-lab .showcase *,
  .lm-lab .showcase *::before,
  .lm-lab .showcase *::after {
    animation: none !important;
    transition: none !important;
  }
  .lm-lab .glass-dock button:is(:hover, :focus-visible) {
    transform: none;
  }
}
@media (prefers-reduced-transparency: reduce) {
  .lm-lab .showcase .lumenmorph {
    --lumen-blur: 0px;
    background: #173538;
  }
  .lm-lab .showcase .foil-pass {
    background: #b0ba9b;
  }
}
@media (forced-colors: active) {
  .lm-lab .showcase,
  .lm-lab .showcase * {
    color: CanvasText !important;
    text-shadow: none !important;
    box-shadow: none !important;
  }
  .lm-lab
    .showcase
    :is(
      .example,
      .showcase-demo,
      .example-caption,
      .showcase-dialog,
      .lumenmorph,
      input,
      button
    ) {
    background: Canvas !important;
    border-color: CanvasText;
  }
  .lm-lab
    .showcase
    :is(.beam-ring, .ignite-halo, .weather-sky, .marble-line, .mesh-lines) {
    display: none;
  }
  .lm-lab .showcase :is(.specimen-word, .outline-word) {
    background: none;
    -webkit-text-stroke: 0;
  }
  .lm-lab .showcase :is([aria-pressed="true"], [aria-current="step"]) {
    outline: 2px solid Highlight;
  }
}
@media (prefers-reduced-motion: reduce) {
  .lm-lab .showcase .light-chart i,
  .lm-lab .showcase .palette-orb {
    transition: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .lm-lab .focus-tasks label,
  .lm-lab .spark-rating span,
  .lm-lab .demo-rating::before {
    transition: none;
  }
}
.lm-lab .showcase {
  padding: 0;
  border: 0;
}
.lm-lab .example {
  border-radius: 4px;
}
