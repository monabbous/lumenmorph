name: Check integrations
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist scss less tailwind public/lab/assets angular/dist web-component/styles.mjs react/index.mjs react/index.d.ts
      - run: git diff --exit-code -- public/lab/examples public/lab/editor-runtime.json
      - run: npm run build:previews -- --check
      - run: npm test
      - run: npm run test:types
      - run: npm run test:svelte
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser -- --reporter=line
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
