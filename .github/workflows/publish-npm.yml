name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish (no automatic bump)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import fs from "node:fs"; if (JSON.parse(fs.readFileSync("package.json")).version !== process.env.EXPECTED_VERSION) process.exit(1)'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npm run test:svelte
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: git diff --exit-code -- dist skins scss less tailwind public/lab/assets public/lab/skins public/lab/r public/lab/examples public/lab/editor-runtime.json angular/dist web-component/styles.mjs react/index.mjs react/index.d.ts
      - run: npm run build:previews -- --check
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
